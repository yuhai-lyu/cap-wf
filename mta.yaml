_schema-version: 3.3.0
ID: bookshop-workflow
version: 1.0.0
description: "BookShop CAP service with SAP Build Process Automation integration"
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
modules:
  - name: bookshop-workflow-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: bookshop-workflow-db
      - name: cap-wf-spa

  - name: bookshop-workflow-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: bookshop-workflow-db

resources:
  - name: bookshop-workflow-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: cap-wf-spa
    type: org.cloudfoundry.managed-service
    parameters:
      service: process-automation-service
      service-plan: standard